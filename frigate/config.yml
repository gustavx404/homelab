# Frigate NVR — config minima (detector CPU, sem câmeras configuradas ainda)
# Referencia: https://docs.frigate.video/configuration/

mqtt:
  enabled: false

# Deteccao por CPU — troque por Coral/GPU quando disponivel
detectors:
  cpu:
    type: cpu
    num_threads: 3

objects:
  track:
    - person
    - car
    - dog
    - cat

cameras:
  camera1:
    # Habilite (enabled: true) ao configurar uma câmera real.
    # Path RTSP de exemplo — ajuste IP/credenciais.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://usuario:senha@192.168.20.100:554/stream1
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: false
      continuous:
        days: 7
      motion:
        days: 0
    snapshots:
      enabled: true
      retain:
        default: 14
version: 0.17-0

# TLS desabilitado — o Traefik termina TLS (self-signed do repo)
tls:
  enabled: false
