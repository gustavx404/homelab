# Namespaces com Pod Security Admission restricted
apiVersion: v1
kind: Namespace
metadata:
  name: core
  labels:
    # privileged, não restricted: o ESPHome (edge.yaml) usa hostNetwork para mDNS,
    # o que a PSA restricted proíbe em nível de namespace. Os demais pods do core
    # continuam com allowPrivilegeEscalation:false + capabilities.drop:[ALL] no container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    # privileged, não restricted: o Suricata (security.yaml) precisa de hostNetwork,
    # hostPID e modo privileged para capturar pacotes na interface real — incompatível
    # com a PSA restricted em nível de namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
