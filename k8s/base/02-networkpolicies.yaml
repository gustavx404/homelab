---
# Namespace ai - OmniRoute + Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-default-deny
  namespace: ai
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-allow
  namespace: ai
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network  # Traefik
      ports:
        - protocol: TCP
          port: 20128  # OmniRoute API/Dashboard
        - protocol: TCP
          port: 20129  # OmniRoute API
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: omniroute-redis
      ports:
        - protocol: TCP
          port: 6379
    - to: []  # DNS, internet (providers LLM externos)
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443

---
# Namespace network - Traefik
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-default-deny
  namespace: network
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-allow
  namespace: network
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from: []  # internet/LoadBalancer
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8181  # Tailscale
  egress:
    - to:
        - namespaceSelector: {}  # rotear para todos os namespaces
      ports:
        - protocol: TCP
          port: 8123   # HA
        - protocol: TCP
          port: 3000   # Forgejo/Grafana
        - protocol: TCP
          port: 8080   # Vaultwarden
        - protocol: TCP
          port: 5000   # Frigate
        - protocol: TCP
          port: 20128  # OmniRoute
        - protocol: TCP
          port: 20129  # OmniRoute API
    - to: []  # Let's Encrypt, DNS
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
