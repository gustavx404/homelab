# Core Apps: Home Assistant, Forgejo, Vaultwarden, Mumble, OmniRoute, Redis
# Todos em namespace core (exceto omniroute/redis em ai)

---
# Home Assistant
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: core
  labels:
    app: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      # A imagem oficial usa s6-overlay e espera rodar como root (ele mesmo
      # ajusta permissões de /run, /config etc. no boot); com runAsNonRoot o
      # s6 falha em "preinit: /run belongs to uid 0 ... lacking privileges to
      # fix it". Não é hardening possível sem trocar de imagem.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          envFrom:
            - secretRef:
                name: homelab-secrets
          volumeMounts:
            - name: config
              mountPath: /config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: custom-components
              mountPath: /config/custom_components
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: custom-components
          configMap:
            name: ha-custom-components
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: core
spec:
  type: ClusterIP
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
  selector:
    app: homeassistant

---
# Forgejo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: core
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: FORGEJO__database__DB_TYPE
              value: mysql
            - name: FORGEJO__database__HOST
              value: mariadb.core.svc.cluster.local
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__server__ROOT_URL
              value: https://git.home/
            - name: FORGEJO__metrics__ENABLED
              value: "true"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          envFrom:
            - secretRef:
                name: homelab-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: core
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      protocol: TCP
    - port: 22
      targetPort: 22
      name: ssh
      protocol: TCP
  selector:
    app: forgejo

---
# Vaultwarden
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: core
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:1.37.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOMAIN
              value: https://vault.home
            - name: ROCKET_PORT
              value: "8080"
            - name: SIGNUPS_ALLOWED
              value: "false"
            # SSO via Authentik desligado: o Authentik referenciado em
            # scripts/authentik-oidc-setup.sh não tem deployment neste cluster
            # (nem em k8s/, nem em compose/services.yaml). Ligar SSO_ENABLED
            # sem isso deixa o Vaultwarden em crash loop (falta SSO_AUTHORITY).
            # Pra habilitar depois: suba o Authentik, defina SSO_AUTHORITY com a
            # URL dele e mapeie SSO_CLIENT_ID/SSO_CLIENT_SECRET a partir de
            # VAULTWARDEN_OIDC_CLIENT_ID/VAULTWARDEN_OIDC_CLIENT_SECRET (já existem
            # em compose/sops-secrets.yaml).
            - name: SSO_ENABLED
              value: "false"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
          envFrom:
            - secretRef:
                name: homelab-secrets  # inclui VAULTWARDEN_ADMIN_TOKEN e VAULTWARDEN_DATABASE_URL
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["/healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: core
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: vaultwarden

---
# Mumble
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mumble
  namespace: core
  labels:
    app: mumble
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mumble
  template:
    metadata:
      labels:
        app: mumble
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mumble
          image: mumblevoip/mumble-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 64738
              name: tcp
              protocol: TCP
            - containerPort: 64738
              name: udp
              protocol: UDP
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: MUMBLE_CONFIG_welcometext
              value: "Welcome to Ducks Server! Quack quack! Channels: Home | Study | Gaming | AFK"
            - name: MUMBLE_CONFIG_registername
              value: "Ducks"
            - name: MUMBLE_CONFIG_port
              value: "64738"
            - name: MUMBLE_CONFIG_users
              value: "100"
            - name: MUMBLE_CONFIG_bandwidth
              value: "72000"
            - name: MUMBLE_CONFIG_database
              value: mumble
            - name: MUMBLE_CONFIG_dbDriver
              value: QMYSQL
            - name: MUMBLE_CONFIG_dbHost
              value: mariadb.core.svc.cluster.local
            - name: MUMBLE_CONFIG_dbPort
              value: "3306"
            - name: MUMBLE_CONFIG_dbUsername
              value: mumble
            - name: MUMBLE_CONFIG_dbPassword
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MUMBLE_DB_PASSWORD
            - name: MUMBLE_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-secrets
                  key: MUMBLE_CONFIG_supw
          # sem envFrom homelab-secrets aqui: ele traria de volta a chave crua
          # MUMBLE_CONFIG_supw, que a imagem tenta interpretar como config
          # genérico e quebra com "Unable to find config corresponding to
          # variable supw". Mumble não usa mais nenhuma outra chave do secret.
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pgrep", "mumble-server"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mumble
  namespace: core
spec:
  type: ClusterIP
  ports:
    - port: 64738
      targetPort: 64738
      name: tcp
      protocol: TCP
    - port: 64738
      targetPort: 64738
      name: udp
      protocol: UDP
  selector:
    app: mumble

---
# OmniRoute (namespace ai)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: ai
  labels:
    app: omniroute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: omniroute
          image: diegosouzapw/omniroute:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 20128
              name: dashboard
            - containerPort: 20129
              name: api
            - containerPort: 20132
              name: live-ws
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homelab-config
                  key: TZ
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: DASHBOARD_PORT
              value: "20128"
            - name: API_PORT
              value: "20129"
            - name: API_HOST
              value: "0.0.0.0"
            - name: LIVE_WS_PORT
              value: "20132"
            - name: LIVE_WS_HOST
              value: "0.0.0.0"
            - name: REDIS_URL
              value: redis://omniroute-redis:6379
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2300"
          envFrom:
            - secretRef:
                name: homelab-secrets  # inclui OMNIROUTE_INITIAL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2500Mi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command: ["node", "healthcheck.mjs"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["node", "healthcheck.mjs"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-data
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: ai
spec:
  type: ClusterIP
  ports:
    - port: 20128
      targetPort: 20128
      name: dashboard
      protocol: TCP
    - port: 20129
      targetPort: 20129
      name: api
      protocol: TCP
    - port: 20132
      targetPort: 20132
      name: live-ws
      protocol: TCP
  selector:
    app: omniroute

---
# Redis para OmniRoute (namespace ai)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute-redis
  namespace: ai
  labels:
    app: omniroute-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omniroute-redis
  template:
    metadata:
      labels:
        app: omniroute-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.6.5-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute-redis
  namespace: ai
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: omniroute-redis
