# Security Stack: Suricata (DaemonSet hostNetwork), CrowdSec, suricata-stats
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  namespace: security
spec:
  selector:
    matchLabels:
      app: suricata
  template:
    metadata:
      labels:
        app: suricata
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: suricata
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: Unconfined
      containers:
        - name: suricata
          image: jasonish/suricata:latest
          command: ["suricata", "-c", "/etc/suricata/suricata.yaml", "--af-packet"]
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, NET_RAW, SYS_NICE, CAP_DAC_OVERRIDE]
          volumeMounts:
            - name: config
              mountPath: /etc/suricata
            - name: rules
              mountPath: /etc/suricata/rules
            - name: logs
              mountPath: /var/log/suricata
            - name: host-network
              mountPath: /host
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: suricata-config
        - name: rules
          configMap:
            name: suricata-rules
        - name: logs
          persistentVolumeClaim:
            claimName: suricata-data
        - name: host-network
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-config
  namespace: security
data:
  suricata.yaml: |
    %YAML 1.1
    ---
    vars:
      address-groups:
        HOME_NET: "[192.168.20.0/24,172.19.0.0/16,10.42.0.0/16,10.43.0.0/16]"
        EXTERNAL_NET: "!$HOME_NET"
    default-log-dir: /var/log/suricata
    outputs:
      - eve-log:
          enabled: yes
          filetype: regular
          filename: eve.json
          types: [alert, http, dns, tls, files, smtp, ssh, flow]
    af-packet:
      - interface: eno1
        cluster-id: 99
        cluster-type: cluster_flow
        defrag: yes
        use-mmap: yes
        tpacket-v3: yes
      - interface: br-homelab
        cluster-id: 98
        cluster-type: cluster_flow
        defrag: yes
        use-mmap: yes
        tpacket-v3: yes
    rule-files:
      - /etc/suricata/rules/*.rules
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-rules
  namespace: security
data:
  homelab.rules: |
    alert icmp any any -> $HOME_NET any (msg:"ICMP Echo"; sid:1000001; rev:1;)
    alert icmp any any -> $HOME_NET any (msg:"ICMP Scan"; threshold: type threshold, track by_src, count 10, seconds 30; sid:1000002; rev:1;)
    alert tcp any any -> $HOME_NET any (flags:S; msg:"SYN Scan"; threshold: type threshold, track by_src, count 5, seconds 3; sid:1000003; rev:1;)
    alert tcp any any -> $HOME_NET any (flags:S,12; msg:"Connect Scan"; threshold: type threshold, track by_src, count 5, seconds 3; sid:1000004; rev:1;)
    alert tcp any any -> $HOME_NET any (flags:0; msg:"NULL Scan"; threshold: type threshold, track by_src, count 3, seconds 10; sid:1000005; rev:1;)
    alert tcp any any -> $HOME_NET any (flags:F; msg:"FIN Scan"; threshold: type threshold, track by_src, count 3, seconds 10; sid:1000006; rev:1;)
    alert tcp any any -> $HOME_NET any (flags:FPU; msg:"XMAS Scan"; threshold: type threshold, track by_src, count 3, seconds 10; sid:1000007; rev:1;)
    alert tcp any any -> $HOME_NET any (msg:"Port Scan"; threshold: type threshold, track by_src, count 10, seconds 5; sid:1000008; rev:1;)
    alert udp any any -> $HOME_NET any (msg:"UDP Scan"; threshold: type threshold, track by_src, count 5, seconds 3; sid:1000009; rev:1;)
    alert tcp any any -> $HOME_NET any (msg:"SSH Brute Force"; flow:to_server,established; content:"SSH"; threshold: type threshold, track by_src, count 8, seconds 30; sid:1000010; rev:1;)
    alert http any any -> $HOME_NET any (msg:"Path Traversal"; content:"../"; http_uri; sid:1000011; rev:1;)
    alert http any any -> $HOME_NET any (msg:"SQL Injection"; content:"union"; http_uri; content:"select"; http_uri; sid:1000012; rev:1;)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suricata
  namespace: security
