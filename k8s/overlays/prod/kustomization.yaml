# Production overlay with SOPS+ksops secrets
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# SOPS secrets (desencriptados pelo ksops no build)
secretGenerator:
  - name: homelab-secrets
    namespace: core
    envs:
      - ../../../compose/.env  # gerado por scripts/decrypt-secrets.sh
    options:
      disableNameSuffixHash: true  # componentes referenciam "homelab-secrets" fixo via apply -f

# ConfigMap para configurações não-sensíveis
configMapGenerator:
  - name: homelab-config
    namespace: core
    literals:
      - TZ=America/Sao_Paulo
      - CLUSTER_DOMAIN=cluster.local
    options:
      disableNameSuffixHash: true  # componentes referenciam "homelab-config" fixo via apply -f
