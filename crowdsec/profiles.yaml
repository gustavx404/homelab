# CrowdSec profiles — ban durations and behavior
# Order matters: most specific first (on_success: break)
# https://docs.crowdsec.net/docs/concepts/profiles

name: repeat_offender
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() contains "scan"
  - Alert.GetEventsCount() >= 3
decisions:
  - type: ban
    duration: 48h
notifications:
  - ntfy_alerts
on_success: break
---
name: scan_ban
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() contains "scan"
decisions:
  - type: ban
    duration: 24h
notifications:
  - ntfy_alerts
on_success: break
---
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 6h
notifications:
  - ntfy_alerts
on_success: break
