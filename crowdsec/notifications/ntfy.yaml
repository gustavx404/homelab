# CrowdSec -> ntfy (plugin http)
# Montado em /etc/crowdsec/notifications/ntfy.yaml (notification_dir default)
# Token: docker exec ntfy ntfy token add crowdsec alerts -> colar em NTFY_TOKEN_CROWDSEC (sops)
# Testar: docker exec crowdsec cscli notifications test ntfy_alerts

type: http
name: ntfy_alerts

# Aguarda 5s juntando alertas; envia se acumular 5 antes do timeout; ate 3 retries
group_wait: 5s
group_threshold: 5
max_retry: 3
timeout: 10s

# Corpo da mensagem (templates Go/Sprig; helpers: first, len, toJson)
format: |
  CrowdSec bloqueou {{ len . }} alerta(s).
  Cenario: {{ (first .).Scenario }}
  Alvo: {{ (first .).Source.IP }}
  Decisao: {{ (first (first .).Decisions).Type }} por {{ (first (first .).Decisions).Duration }}

url: "http://ntfy:80/${NTFY_TOPIC_ALERTS}"
method: POST
headers:
  Authorization: "Bearer ${NTFY_TOKEN_CROWDSEC}"
  Title: "CrowdSec: ban aplicado"
  Priority: "urgent"
  Tags: "rotating_light"
