# CrowdSec database config — MariaDB instead of SQLite
# Database and user created in mariadb container (compose/database-init/)
# A senha vem do compose/.env (sops) via interpolacao de variavel de ambiente (CrowdSec >= 1.5)
db_config:
  type: mysql
  user: crowdsec
  password: ${CROWDSEC_DB_PASSWORD}
  db_name: crowdsec
  host: mariadb
  port: 3306
  flush:
    max_items: 5000
    max_age: 7d
