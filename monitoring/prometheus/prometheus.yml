---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: homeassistant
    metrics_path: /api/prometheus
    static_configs:
      - targets:
          - homeassistant:8123

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: forgejo
    metrics_path: /metrics
    static_configs:
      - targets:
          - forgejo:3000
