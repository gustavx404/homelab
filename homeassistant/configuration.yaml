---
default_config:

homeassistant:
  name: Home
  unit_system: metric
  time_zone: America/Sao_Paulo
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation

recorder:
  db_url: !secret recorder_db_url

frigate:
  url: http://frigate:8971

automation: !include automations.yaml
script: !include scripts.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.19.0.0/16

# HomeKit Bridge — expoe dispositivos do HA p/ Apple Home (iPhone/iPad/Apple TV)
# Requer avahi-daemon no host p/ mDNS entre Docker bridge e LAN:
#   sudo apt install avahi-daemon
#   sudo sed -i 's/#enable-reflector=no/enable-reflector=yes/' /etc/avahi/avahi-daemon.conf
#   sudo systemctl restart avahi-daemon
# Apos subir: abra o app Casa no iPhone > Adicionar Acessorio > escanear QR code
#   (Configuracoes > Dispositivos e servicos > HomeKit Bridge no HA)
homekit:
  advertise_ip: "192.168.20.189"
