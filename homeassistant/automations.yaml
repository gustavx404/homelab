# Automations do Home Assistant
# ============================================================================
# Notificacoes usam notify.notify (envia p/ todos os destinos registrados:
# Companion App, persistent_notification, etc.)
#
# Para notificar so no celular, substitua notify.notify por
# notify.mobile_app_SEU_DISPOSITIVO (ex: notify.mobile_app_iphone).
# Encontre o ID em: Developer Tools > States > filtre "notify.mobile_app"
# ============================================================================

# --- CrowdSec webhook (recebe alerts do plugin HTTP do CrowdSec) ---
# Descomente e ajuste o webhook_id apos definir HA_WEBHOOK_ID no sops.
#
# - id: crowdsec_alerts
#   alias: "CrowdSec: alerta de ban via webhook"
#   triggers:
#     - trigger: webhook
#       webhook_id: crowdsec_alerts
#   actions:
#     - action: notify.notify
#       data:
#         title: "CrowdSec"
#         message: "{{ trigger.json.message }}"

- id: frigate_person_alert
  alias: "Frigate: pessoa detectada (alerta)"
  triggers:
    - trigger: event
      event_type: frigate/events
      event_data:
        type: new
        label: person
  conditions:
    # Ajuste para os nomes das suas cameras (frigate/config.yml)
    - condition: template
      value_template: "{{ trigger.event.data.after.camera in ['front_gate', 'back_yard'] }}"
  actions:
    - action: notify.notify
      data:
        title: "Seguranca"
        message: "Pessoa detectada em {{ trigger.event.data.after.camera }}"

- id: frigate_motion_home
  alias: "Frigate: movimento registrado (informativo)"
  triggers:
    - trigger: event
      event_type: frigate/events
      event_data:
        type: new
        label: motion
  conditions:
    - condition: template
      value_template: "{{ trigger.event.data.after.camera in ['front_gate', 'back_yard'] }}"
  actions:
    - action: notify.notify
      data:
        title: "Camera"
        message: "Movimento em {{ trigger.event.data.after.camera }}"
