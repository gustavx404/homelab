# Scripts do Home Assistant
# Uso em automacoes: action: script.notify_alert / script.notify_home

- id: notify_alert
  alias: "Notificar alerta (todos os destinos)"
  fields:
    message:
      description: "Mensagem a enviar"
      example: "Algo importante aconteceu"
  sequence:
    - action: notify.notify
      data:
        title: "Homelab"
        message: "{{ message }}"

- id: notify_home
  alias: "Notificar informativo (todos os destinos)"
  fields:
    message:
      description: "Mensagem a enviar"
      example: "Movimento detectado"
  sequence:
    - action: notify.notify
      data:
        title: "Casa"
        message: "{{ message }}"
