---
# Home Assistant secrets
# Values sourced from environment variables set in compose

home_latitude: !env_var HOMEASSISTANT_LATITUDE
home_longitude: !env_var HOMEASSISTANT_LONGITUDE
home_elevation: !env_var HOMEASSISTANT_ELEVATION
recorder_db_url: !env_var RECORDER_DB_URL
ha_oidc_client_id: !env_var HA_OIDC_CLIENT_ID
ha_oidc_client_secret: !env_var HA_OIDC_CLIENT_SECRET
