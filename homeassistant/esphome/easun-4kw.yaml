substitutions:
  name: esp32-easun-rs232
  friendly_name: esp32-easun-rs232
  device_description: "Monitor and control a ISolar/EASUN SMG II 11Kw inverter via RS232"
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  comment: ${device_description}
  project:
    name: "robgt.esphome-smg-11Kw"
    version: 1.1.1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.20.143
    gateway: 192.168.20.1
    subnet: 255.255.255.0
    dns1: 192.168.20.1
    dns2: 8.8.8.8

web_server:
  port: 8080

captive_portal:

logger:
  level: INFO

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 10s

time:
  - platform: sntp

sensor:

  # Fault code
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} fault code"
    address: 100
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Warning code
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} warning code"
    address: 108
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Operation Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} operation mode id"
    address: 201
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0

  # AC Mains Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} ac mains voltage"
    address: 338
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Mains Frequency
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} ac mains frequency"
    address: 203
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Average Mains Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} average mains power"
    address: 340
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Output Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output effective voltage"
    address: 606
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output effective Current"
    address: 605
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output Frequency
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output frequency"
    address: 607
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Output Active Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output active power"
    address: 254
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Output Apparent Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output apparent power"
    address: 255
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  # Battery Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery average voltage"
    address: 277
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery average Current"
    address: 278
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery average power"
    address: 279
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Battery SOC
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery state of charge"
    address: 280
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0

  # PV1 Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} pv1 average voltage"
    address: 351
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV2 Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} pv2 average voltage"
    address: 389
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV1 Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} pv1 average current"
    address: 352
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV2 Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} pv2 average current"
    address: 390
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV1 Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg0_pv1_average_power
    name: "${name} pv1 average power"
    address: 353
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # PV2 Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg0_pv2_average_power
    name: "${name} pv2 average power"
    address: 391
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # PV1-2 Combined Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg0_pv1_2_average_power
    name: "${name} pv1-2 average power"
    address: 302
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # PV1-2 Charging Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} pv1-2 charging average power"
    address: 303
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Load Percentage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} load percentage"
    address: 256
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # DCDC Temperature
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} dcdc temperature"
    address: 281
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # Inverter Temperature
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} inverter temperature"
    address: 231
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # Daily Production
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg0_power_day
    name: "${name} produzione day"
    address: 702
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 10.0

  # Rated Power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} rated power"
    address: 691
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0

select:

  # Output Priority
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output priority"
    use_write_multiple: true
    address: 601
    value_type: U_WORD
    optionsmap:
      "PV-Utility-Battery (SUB)": 1
      "PV-Battery-Utility (SBU)": 2
      "PV-Utility-Battery (SUF)": 3

  # Input Voltage Range
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} input voltage range"
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    optionsmap:
      "Wide range": 0
      "Narrow range": 1

  # Buzzer Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} buzzer mode"
    use_write_multiple: true
    address: 303
    value_type: U_WORD
    optionsmap:
      "Silent": 0
      "Beep on changes, warnings and faults": 1
      "Beep on warnings and faults": 2
      "Beep on faults only": 3

  # Battery Charging Priority
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery charging priority"
    use_write_multiple: true
    address: 632
    value_type: U_WORD
    optionsmap:
      "SOF": 1
      "SNU": 2
      "OSO": 3
      "SOT": 4

  # Turn On Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} turn on mode"
    use_write_multiple: true
    address: 693
    value_type: U_WORD
    optionsmap:
      "Local and remote": 0
      "Local only": 1
      "Remote only": 2

switch:

  # Neutral to Ground
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} neutral to ground"
    use_write_multiple: true
    address: 707
    register_type: holding
    bitmask: 1

  # LCD Backlight Always On
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} lcd backlight always on"
    use_write_multiple: true
    address: 305
    register_type: holding
    bitmask: 1

  # LCD Auto Return to Homepage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} lcd auto return to homepage"
    use_write_multiple: true
    address: 306
    register_type: holding
    bitmask: 1

  # Energy-Saving Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} energy-saving mode"
    use_write_multiple: true
    address: 307
    register_type: holding
    bitmask: 1

  # Overload Auto Restart
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} overload automatic restart"
    use_write_multiple: true
    address: 308
    register_type: holding
    bitmask: 1

  # Over Temperature Auto Restart
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} over temperature automatic restart"
    use_write_multiple: true
    address: 309
    register_type: holding
    bitmask: 1

  # Overload Transfer to Bypass
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} overload transfer to bypass"
    use_write_multiple: true
    address: 310
    register_type: holding
    bitmask: 1

  # Battery EQ Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery EQ mode"
    use_write_multiple: true
    address: 313
    register_type: holding
    bitmask: 1

  # Remote Switch (shutdown/turn-on)
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} remote switch"
    use_write_multiple: true
    address: 694
    register_type: holding
    bitmask: 1

number:

  # Battery Overvoltage Protection Point
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery overvoltage protection point"
    use_write_multiple: true
    address: 631
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Max Charging Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} max charging voltage"
    use_write_multiple: true
    address: 637
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Floating Charging Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} floating charging voltage"
    use_write_multiple: true
    address: 638
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery Discharge Recovery Point (Mains Mode)
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery discharge recovery point in mains mode"
    use_write_multiple: true
    address: 646
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery Low Voltage Protection (Mains Mode)
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery low voltage protection point in mains mode"
    use_write_multiple: true
    address: 644
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery Low Voltage Protection (Off-Grid Mode)
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery low voltage protection point in off-grid mode"
    use_write_multiple: true
    address: 643
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum Charging Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} maximum charging current"
    use_write_multiple: true
    address: 640
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum Mains Charging Current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} maximum mains charging current"
    use_write_multiple: true
    address: 641
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery Equalization Time
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery equalization time"
    use_write_multiple: true
    address: 335
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 900.0
    step: 1
    unit_of_measurement: "min"

  # Equalization Timeout Exit
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} equalization timeout exit"
    use_write_multiple: true
    address: 336
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 900.0
    step: 1
    unit_of_measurement: "min"

  # Two Equalization Charging Intervals
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} two equalization charging intervals"
    use_write_multiple: true
    address: 337
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 90.0
    step: 1
    unit_of_measurement: "day"

text_sensor:

  # Fault Code Text
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} fault"
    address: 100
    register_type: holding
    register_count: 2
    response_size: 4
    raw_encode: HEXBYTES
    lambda: |-
      static const uint8_t FAULTS_SIZE = 27;
      static const char *const FAULTS[FAULTS_SIZE] = {
          "Over temperature of inverter module",
          "Over temperature of DCDC module",
          "Battery over voltage",
          "PV module over temperature",
          "Output short circuit",
          "Inverter over voltage",
          "Output over load",
          "Bus over voltage",
          "Bus soft start timed out",
          "PV over current",
          "PV over voltage",
          "Battery over current",
          "Inverter over current",
          "Bus low voltage",
          "Reserve (Bit 15)",
          "Inverter DC component is too high",
          "Reserve (Bit 17)",
          "The zero bias of output current is too large",
          "The zero bias of inverter current is too large",
          "The zero bias of battery current is too large",
          "The zero bias of PV current is too large",
          "Inverter low voltage",
          "Inverter negative power protection",
          "The host in the parallel system is lost",
          "Synchronization signal abnormal in the parallel system",
          "The battery type is incompatible",
          "Parallel versions are incompatible",
      };
      std::string values = "";
      uint32_t mask = modbus_controller::dword_from_hex_str(x, 0);
      if (mask) {
        for (int i = 0; i < FAULTS_SIZE; i++) {
          if (mask & (1 << i)) {
            values.append(FAULTS[i]);
            values.append(";");
          }
        }
        if (!values.empty()) values.pop_back();
      }
      return values;

  # Warning Code Text
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} warning"
    address: 108
    register_type: holding
    register_count: 2
    response_size: 4
    raw_encode: HEXBYTES
    lambda: |-
      static const uint8_t WARNINGS_SIZE = 19;
      static const char *const WARNINGS[WARNINGS_SIZE] = {
          "Reserve (Bit 0)",
          "Mains waveform abnormal",
          "Reserve (Bit 2)",
          "Mains low voltage",
          "Mains over frequency",
          "Mains low frequency",
          "PV low voltage",
          "Over temperature",
          "Battery low voltage",
          "Battery is not connected",
          "Overload",
          "Battery Eq charging",
          "Battery undervoltage",
          "Output power derating",
          "Fan blocked",
          "PV energy is too low to be use",
          "Parallel communication interrupted",
          "Output mode of Single and Parallel systems inconsistent",
          "Battery voltage difference of parallel system is too large",
      };
      std::string values = "";
      uint32_t mask = modbus_controller::dword_from_hex_str(x, 0);
      if (mask) {
        for (int i = 0; i < WARNINGS_SIZE; i++) {
          if (mask & (1 << i)) {
            values.append(WARNINGS[i]);
            values.append(";");
          }
        }
        if (!values.empty()) values.pop_back();
      }
      return values;

  # Operation Mode Text
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} operation mode"
    address: 201
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Power On");
        case 1: return std::string("Standby");
        case 2: return std::string("Mains");
        case 3: return std::string("Off-Grid");
        case 4: return std::string("Bypass");
        case 5: return std::string("Charging");
        case 6: return std::string("Fault");
      }
      return std::string("Unknown");
