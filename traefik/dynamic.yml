# Traefik dynamic configuration — path-based routing (any host)
# Works with any IP or hostname — no hardcoded dependencies

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    grafana-strip:
      stripPrefix:
        prefixes:
          - "/grafana"
    git-strip:
      stripPrefix:
        prefixes:
          - "/git"

  routers:
    # Grafana — higher priority, path-based
    grafana:
      rule: "PathPrefix(`/grafana`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - grafana-strip
      service: grafana
      tls: {}

    # Forgejo — higher priority, path-based
    forgejo:
      rule: "PathPrefix(`/git`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - git-strip
      service: forgejo
      tls: {}

    # Home Assistant — default (lowest priority)
    homeassistant:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"
