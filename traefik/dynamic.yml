# Traefik dynamic configuration — hostname-based routing
# DNS: 192.168.20.189 ha.home grafana.home git.home frigate.home photos.home

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Ingress-Path: "/frigate"
    frigate-auth:
      basicAuth:
        users:
          - "frigate:$2y$12$8qbhOjw2gna2jO31S9jvTulqUdzoQdgYWMjqe9lyI6dx9kKYAXMTe"

  routers:
    homeassistant:
      rule: "Host(`ha.home`)"
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

    grafana:
      rule: "Host(`grafana.home`)"
      entryPoints:
        - websecure
      service: grafana
      tls: {}

    forgejo:
      rule: "Host(`git.home`)"
      entryPoints:
        - websecure
      service: forgejo
      tls: {}

    frigate:
      rule: "Host(`frigate.home`)"
      entryPoints:
        - websecure
      middlewares:
        - frigate-headers
        - frigate-auth
      service: frigate
      tls: {}

    immich:
      rule: "Host(`photos.home`)"
      entryPoints:
        - websecure
      service: immich
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    frigate:
      loadBalancer:
        servers:
          - url: "http://frigate:8971"

    immich:
      loadBalancer:
        servers:
          - url: "http://immich-server:2283"
