# Traefik dynamic configuration — path-based routing (any host)
# Works with any IP or hostname — no hardcoded dependencies

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    grafana-strip:
      stripPrefix:
        prefixes:
          - "/grafana"
    git-strip:
      stripPrefix:
        prefixes:
          - "/git"
    frigate-strip:
      stripPrefix:
        prefixes:
          - "/frigate"
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Ingress-Path: "/frigate"
    # Frigate tem login proprio? Nao. Protecao obrigatoria (senha em sops-secrets.yaml, FRIGATE_AUTH_*)
    frigate-auth:
      basicAuth:
        users:
          - "frigate:$2y$05$2GuSh2p.RMAyL/LacCq.JejKc1gpT2reXvRYGib/qMlxtGgStkLc2"

  routers:
    # Grafana — higher priority, path-based
    grafana:
      rule: "PathPrefix(`/grafana`) || PathPrefix(`/grafana/`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - grafana-strip
      service: grafana
      tls: {}

    # Forgejo — higher priority, path-based
    forgejo:
      rule: "PathPrefix(`/git`) || PathPrefix(`/git/`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - git-strip
      service: forgejo
      tls: {}

    # Frigate — path-based, autenticacao obrigatoria (sem login embutido)
    frigate:
      rule: "PathPrefix(`/frigate`) || PathPrefix(`/frigate/`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - frigate-strip
        - frigate-headers
        - frigate-auth
      service: frigate
      tls: {}

    # Home Assistant — default (lowest priority)
    homeassistant:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    frigate:
      loadBalancer:
        servers:
          - url: "http://frigate:8971"
