# Traefik dynamic configuration — path-based routing (any host)
# Works with any IP or hostname — no hardcoded dependencies
# Excecao: Immich nao suporta subpath — router host-based (photos.home)

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    grafana-strip:
      stripPrefix:
        prefixes:
          - "/grafana"
    git-strip:
      stripPrefix:
        prefixes:
          - "/git"
    frigate-strip:
      stripPrefix:
        prefixes:
          - "/frigate"
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Ingress-Path: "/frigate"
    # Frigate basicAuth — senha em sops-secrets.yaml (FRIGATE_AUTH_USER / FRIGATE_AUTH_PASSWORD)
    # Para rotacionar: docker run --rm httpd:alpine htpasswd -nbB -C 12 <user> <senha>
    frigate-auth:
      basicAuth:
        users:
          - "frigate:$2y$12$8qbhOjw2gna2jO31S9jvTulqUdzoQdgYWMjqe9lyI6dx9kKYAXMTe"

  routers:
    # Grafana — higher priority, path-based
    grafana:
      rule: "PathPrefix(`/grafana`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - grafana-strip
      service: grafana
      tls: {}

    # Forgejo — higher priority, path-based
    forgejo:
      rule: "PathPrefix(`/git`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - git-strip
      service: forgejo
      tls: {}

    # Frigate — path-based, autenticacao obrigatoria (sem login embutido)
    frigate:
      rule: "PathPrefix(`/frigate`)"
      priority: 10
      entryPoints:
        - websecure
      middlewares:
        - frigate-strip
        - frigate-headers
        - frigate-auth
      service: frigate
      tls: {}

    # Immich — host-based (nao suporta subpath); acesso: https://photos.home
    # DNS local obrigatorio (dnsmasq no OpenWrt ou /etc/hosts do dispositivo)
    immich:
      rule: "Host(`photos.home`)"
      priority: 10
      entryPoints:
        - websecure
      service: immich
      tls: {}

    # Home Assistant — default (lowest priority)
    homeassistant:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    frigate:
      loadBalancer:
        servers:
          - url: "http://frigate:8971"

    immich:
      loadBalancer:
        servers:
          - url: "http://immich-server:2283"
