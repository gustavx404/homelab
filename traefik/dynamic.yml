# Traefik dynamic configuration — hostname-based routing
# DNS local: 192.168.20.189 ha.home grafana.home git.home frigate.home vault.home
# DNS Tailscale: ha.<tailnet>.ts.net grafana.<tailnet>.ts.net etc. (serve config)

http:
  middlewares:
    sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customFrameOptionsValue: "SAMEORIGIN"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Ingress-Path: "/frigate"
    frigate-auth:
      basicAuth:
        users:
          - "frigate:$2y$12$8qbhOjw2gna2jO31S9jvTulqUdzoQdgYWMjqe9lyI6dx9kKYAXMTe"


  routers:
    homeassistant:
      rule: "Host(`ha.home`) || HostRegexp(`^ha\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

    grafana:
      rule: "Host(`grafana.home`) || HostRegexp(`^grafana\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - sec-headers
      service: grafana
      tls: {}

    forgejo:
      rule: "Host(`git.home`) || HostRegexp(`^git\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - sec-headers
      service: forgejo
      tls: {}

    frigate:
      rule: "Host(`frigate.home`) || HostRegexp(`^frigate\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - frigate-headers
        - frigate-auth
      service: frigate
      tls: {}

    vaultwarden:
      rule: "Host(`vault.home`) || HostRegexp(`^vault\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - sec-headers
      service: vaultwarden
      tls: {}

    omniroute:
      rule: "Host(`omniroute.home`) || HostRegexp(`^omniroute\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - sec-headers
      service: omniroute
      tls: {}

    # Routers p/ o entrypoint tailscale (sem tls): o Tailscale Serve/Funnel ja
    # termina o TLS e faz proxy HTTP em 127.0.0.1:8181. Routers com tls:{} so
    # atendem trafego TLS e ignorariam o HTTP plain, por isso sao separados.
    homeassistant-ts:
      rule: "HostRegexp(`^ha\\..+\\.ts\\.net$`) || Host(`ha1.buru-eagle.ts.net`)"
      entryPoints:
        - tailscale
      middlewares:
        - ha-headers
      service: homeassistant

    homeassistant-ts-tls:
      rule: "HostRegexp(`^ha\\..+\\.ts\\.net$`) || Host(`ha1.buru-eagle.ts.net`)"
      entryPoints:
        - tailscale-tls
      middlewares:
        - ha-headers
      service: homeassistant

    grafana-ts:
      rule: "HostRegexp(`^grafana\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: grafana

    forgejo-ts:
      rule: "HostRegexp(`^git\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: forgejo

    frigate-ts:
      rule: "HostRegexp(`^frigate\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      middlewares:
        - frigate-headers
        - frigate-auth
      service: frigate

    vaultwarden-ts:
      rule: "HostRegexp(`^vault\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: vaultwarden

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    frigate:
      loadBalancer:
        servers:
          - url: "http://frigate:8971"

    9router:
      loadBalancer:
        servers:
          - url: "http://9router:20128"
        passHostHeader: true

    vaultwarden:
      loadBalancer:
        servers:
          - url: "http://vaultwarden:80"
        passHostHeader: true

    omniroute:
      loadBalancer:
        servers:
          - url: "http://omniroute:20128"
        passHostHeader: true

tls:
  certificates:
    - certFile: /certs/ha1.crt
      keyFile: /certs/ha1.key
