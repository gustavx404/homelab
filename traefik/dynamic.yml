# Traefik dynamic configuration — hostname-based routing
# DNS local: 192.168.20.189 ha.home grafana.home git.home frigate.home authentik.home photos.home vault.home
# DNS Tailscale: ha.<tailnet>.ts.net grafana.<tailnet>.ts.net etc. (serve config)

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Ingress-Path: "/frigate"
    frigate-auth:
      basicAuth:
        users:
          - "frigate:$2y$12$8qbhOjw2gna2jO31S9jvTulqUdzoQdgYWMjqe9lyI6dx9kKYAXMTe"
    strip-git:
      stripPrefix:
        prefixes:
          - "/git"

  routers:
    homeassistant:
      rule: "Host(`ha.home`) || HostRegexp(`^ha\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

    grafana:
      rule: "Host(`grafana.home`) || HostRegexp(`^grafana\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      service: grafana
      tls: {}

    forgejo:
      rule: "Host(`git.home`) || HostRegexp(`^git\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      service: forgejo
      tls: {}

    authentik:
      rule: "Host(`authentik.home`) || HostRegexp(`^authentik\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      service: authentik
      tls: {}

    frigate:
      rule: "Host(`frigate.home`) || HostRegexp(`^frigate\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      middlewares:
        - frigate-headers
        - frigate-auth
      service: frigate
      tls: {}

    immich:
      rule: "Host(`photos.home`) || HostRegexp(`^photos\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      service: immich
      tls: {}

    vaultwarden:
      rule: "Host(`vault.home`) || HostRegexp(`^vault\\..+\\.ts\\.net$`)"
      entryPoints:
        - websecure
      service: vaultwarden
      tls: {}

    # Routers p/ o entrypoint tailscale (sem tls): o Tailscale Serve/Funnel ja
    # termina o TLS e faz proxy HTTP em 127.0.0.1:8181. Routers com tls:{} so
    # atendem trafego TLS e ignorariam o HTTP plain, por isso sao separados.
    homeassistant-ts:
      rule: "HostRegexp(`^ha\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      middlewares:
        - ha-headers
      service: homeassistant

    grafana-ts:
      rule: "HostRegexp(`^grafana\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: grafana

    forgejo-ts:
      rule: "HostRegexp(`^git\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: forgejo

    authentik-ts:
      rule: "HostRegexp(`^authentik\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: authentik

    frigate-ts:
      rule: "HostRegexp(`^frigate\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      middlewares:
        - frigate-headers
        - frigate-auth
      service: frigate

    immich-ts:
      rule: "HostRegexp(`^photos\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: immich

    vaultwarden-ts:
      rule: "HostRegexp(`^vault\\..+\\.ts\\.net$`)"
      entryPoints:
        - tailscale
      service: vaultwarden

    # Path-based routing p/ Funnel (dominio principal homelab.buru-eagle.ts.net)
    funnel-root:
      rule: "Host(`homelab.buru-eagle.ts.net`)"
      entryPoints:
        - tailscale
      service: authentik

    funnel-git:
      rule: "Host(`homelab.buru-eagle.ts.net`) && PathPrefix(`/git`)"
      entryPoints:
        - tailscale
      middlewares:
        - strip-git
      service: forgejo

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
        passHostHeader: true

    frigate:
      loadBalancer:
        servers:
          - url: "http://frigate:8971"

    immich:
      loadBalancer:
        servers:
          - url: "http://immich-server:2283"
        passHostHeader: true

    vaultwarden:
      loadBalancer:
        servers:
          - url: "http://vaultwarden:80"
        passHostHeader: true
