# Traefik dynamic configuration — subdomain routing
# Access: ha.homelab.lan | grafana.homelab.lan | git.homelab.lan
# Add to /etc/hosts: 192.168.20.189 ha.homelab.lan grafana.homelab.lan git.homelab.lan

http:
  middlewares:
    ha-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-For: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""

  routers:
    homeassistant:
      rule: "Host(`ha.homelab.lan`)"
      entryPoints:
        - websecure
      middlewares:
        - ha-headers
      service: homeassistant
      tls: {}

    grafana:
      rule: "Host(`grafana.homelab.lan`)"
      entryPoints:
        - websecure
      service: grafana
      tls: {}

    forgejo:
      rule: "Host(`git.homelab.lan`)"
      entryPoints:
        - websecure
      service: forgejo
      tls: {}

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://homeassistant:8123"
        passHostHeader: true

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"
