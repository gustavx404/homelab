# Traefik static configuration

global:
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # timeouts longos p/ uploads de midia (frigate/HA)
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 600s

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  dashboard: true

log:
  level: INFO
