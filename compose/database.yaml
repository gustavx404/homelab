---
# Database stack: MariaDB central — banco compartilhado
# Usado por: Home Assistant (recorder), Forgejo, Vaultwarden e CrowdSec.
# Bancos/usuarios das apps: compose/database-init/ (criados no primeiro boot).

services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    networks:
      - backend
    volumes:
      - ../data/mariadb:/var/lib/mysql
      - ../compose/database-init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE_FILE=/run/secrets/MARIADB_DATABASE
      - MARIADB_USER_FILE=/run/secrets/MARIADB_USER
      - MARIADB_PASSWORD_FILE=/run/secrets/MARIADB_PASSWORD
      # Senhas dos bancos das apps (compose/.env gerado pelo sops) —
      # usadas por compose/database-init/ para criar usuarios no primeiro boot.
      - FORGEJO_DB_PASSWORD=${FORGEJO_DB_PASSWORD:?FORGEJO_DB_PASSWORD required}
      - CROWDSEC_DB_PASSWORD=${CROWDSEC_DB_PASSWORD:?CROWDSEC_DB_PASSWORD required}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD required}
    secrets:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=50
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
