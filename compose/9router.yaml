---
# 9Router stack — FREE AI Router & Token Saver
# Acesso via Traefik: https://9router.home (websecure) + Headroom opcional
# Dados persistidos em ../data/9router (SQLite) — gitignorado, versionado por backup tar
# Nao exposta porta host direta — trafego via Traefik reverse proxy apenas
# Se necessario acesso remoto via Tailscale Funnel: adicione sidecar ts-9router + serve.json
# Variaveis de ambiente: TZ (compartilhado .env), DATA_DIR, PORT, HOSTNAME, NODE_ENV, NEXT_PUBLIC_BASE_URL
# Sem segredos — chaves de provedor sao configuradas no dashboard (UI web)

services:
  9router:
    image: decolua/9router:0.5.55
    container_name: 9router
    networks:
      - backend
    volumes:
      - ../data/9router:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=https://9router.home
      - INITIAL_PASSWORD_FILE=/run/secrets/9ROUTER_INITIAL_PASSWORD
      - HEADROOM_URL=http://headroom:8787
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]
    entrypoint: ["node", "custom-server.js"]
    depends_on:
      headroom:
        condition: service_healthy
    secrets:
      - 9ROUTER_INITIAL_PASSWORD
    # Nao expor porta host — acesso exclusivo via Traefik (https://9router.home).
    # Para acesso LAN direto: descomente a linha abaixo e remova o bloco corresponding
    # no traefik/dynamic.yml (ports: ["192.168.20.189:20128:20128"]).
    # Se precisar Tailscale Funnel: crie ts-9router sidecar com *-serve.json e ajuste
    # NEXT_PUBLIC_BASE_URL para https://9router.buru-eagle.ts.net

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    networks:
      - backend
    volumes:
      - ../data/headroom:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s