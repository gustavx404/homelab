---
# Notifications stack: ntfy (push self-hosted)
# Acesso web: https://ntfy.home (Traefik). Auth: deny-all + usuarios.
# Primeiro boot:
#   docker exec -it ntfy ntfy user add --role=admin admin     # cria admin (senha: NTFY_ADMIN_PASSWORD no sops)
#   docker exec ntfy ntfy user add crowdsec                    # service user (CrowdSec)
#   docker exec ntfy ntfy access crowdsec alerts rw            # ACL do topico alerts
#   docker exec ntfy ntfy token add crowdsec alerts            # token tk_* -> NTFY_TOKEN_CROWDSEC

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    networks:
      - backend
    volumes:
      - ../data/ntfy:/var/lib/ntfy
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://ntfy.home}
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    command: serve
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
