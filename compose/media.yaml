---
# Media stack: NVR (frigate) + fotos (immich)

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable@sha256:06e48c72f5af2887eafff09a4c53e8df9238827ae9e8df811cbdeaab1c7a4330
    container_name: frigate
    networks:
      - backend
    ports:
      - "8554:8554"       # RTSP restream (players externos) — restringir no firewall
      - "8555:8555/tcp"   # WebRTC — restringir no firewall
      - "8555:8555/udp"   # WebRTC — restringir no firewall
    volumes:
      - ../data/frigate:/config
      - ../frigate/config.yml:/config/config.yml
      - ../data/frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - TZ=${TZ}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 512mb
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/version')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich-server
    networks:
      - backend
    # acesso via Traefik: https://photos.home (host-based; subpath nao suportado)
    volumes:
      - ${UPLOAD_LOCATION:-../data/immich/library}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=database
      - DB_PORT=5432
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME}
      - REDIS_HOSTNAME=redis
      - REDIS_PORT=6379
      - REDIS_DBINDEX=0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:2283/api/server/ping')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    container_name: immich-machine-learning
    networks:
      - backend
    volumes:
      - model-cache:/cache
    environment:
      - TZ=${TZ}
      - MACHINE_LEARNING_WORKERS=1  # host com 4 cores compartilhados com 15+ servicos
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:3003/ping', timeout=5)" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: valkey/valkey:9@sha256:2f4a4b0a42a72569b40567fae9016dc54aa76736250be28120b5fced8050c0f0
    container_name: immich-redis
    networks:
      - backend
    volumes:
      - ../data/immich/redis:/data
    command:
      - --appendonly
      - "yes"
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:b1d33572a9a0634aa6d344077467ad32847812a37fa3859f702952cba22a2f55
    container_name: immich-postgres
    networks:
      - backend
    volumes:
      - ${DB_DATA_LOCATION:-../data/immich/postgres}:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=${IMMICH_DB_USERNAME}
      - POSTGRES_DB=${IMMICH_DB_NAME}
      - POSTGRES_INITDB_ARGS=--data-checksums
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-cache:
