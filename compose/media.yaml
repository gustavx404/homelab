---
# Media stack: NVR (frigate)

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable@sha256:06e48c72f5af2887eafff09a4c53e8df9238827ae9e8df811cbdeaab1c7a4330
    container_name: frigate
    networks:
      - backend
    ports:
      - "192.168.20.189:8554:8554"  # RTSP restream (players externos) — restringir no firewall
      - "192.168.20.189:8555:8555/tcp"  # WebRTC (UI) — restringir no firewall
      - "192.168.20.189:8555:8555/udp"  # WebRTC (UI) — restringir no firewall
    volumes:
      - ../data/frigate:/config
      - ../frigate/config.yml:/config/config.yml
      - ../data/frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - TZ=${TZ}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 512mb
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/version')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
