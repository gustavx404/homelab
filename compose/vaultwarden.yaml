---
# Vaultwarden stack: gerenciador de senhas (API compativel com Bitwarden) — https://vault.home
# Banco: MariaDB central (database.yaml) — usuario/bancos criados em compose/database-init/
# Acesso exclusivo via Traefik (sem portas expostas). Senhas via Docker secrets (NUNCA env vars).
# Setup (1x): sops compose/sops-secrets.yaml -> VAULTWARDEN_* ; bash scripts/decrypt-secrets.sh

services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.1
    container_name: vaultwarden
    networks:
      - backend
    volumes:
      - ../data/vaultwarden:/data
      - /etc/localtime:/etc/localtime:ro
    # SSO discovery via Traefik sem depender do DNS .home na LAN (host-gateway = IP do host)
    environment:
      - TZ=${TZ}
      - DOMAIN=https://vault.home
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN_FILE=/run/secrets/VAULTWARDEN_ADMIN_TOKEN
      - DATABASE_URL_FILE=/run/secrets/VAULTWARDEN_DATABASE_URL
      # SSO via Authentik (OIDC). Provider criado por scripts/authentik-oidc-setup.sh
      # Callback: https://vault.home/identity/connect/oidc-signin (auto a partir do DOMAIN)
      - SSO_ENABLED=true
      - SSO_SCOPES=openid profile email offline_access
    secrets:
      - VAULTWARDEN_ADMIN_TOKEN
      - VAULTWARDEN_DATABASE_URL
    depends_on:
      mariadb:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Tailscale Funnel dedicado p/ Vaultwarden (node proprio = DNS publico)
  ts-vaultwarden:
    image: tailscale/tailscale:latest
    container_name: ts-vaultwarden
    hostname: vault
    networks:
      - backend
    volumes:
      - ../data/ts-vaultwarden:/var/lib/tailscale
      - ../compose/vaultwarden-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:?TAILSCALE_AUTHKEY required}
      - TS_HOSTNAME=vault
      - TS_CERT_DOMAIN=vault.buru-eagle.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
