---
# Vaultwarden stack: gerenciador de senhas (API compativel com Bitwarden)
# Acesso exclusivo via Traefik: https://vault.home (sem portas expostas)

services:
  vaultwarden:
    image: docker.io/vaultwarden/server:latest
    container_name: vaultwarden
    networks:
      - backend
    environment:
      - TZ=${TZ}
      - DOMAIN=https://vault.home
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - DATABASE_URL=mysql://vaultwarden:${VAULTWARDEN_DB_PASSWORD:-vw_db_pass_2026}@mariadb/vaultwarden
    volumes:
      - ../data/vaultwarden:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
