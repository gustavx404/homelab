---
# Immich stack: fotos/videos — acesso https://photos.home (Traefik, host-based)
# Banco: PostgreSQL proprio (com extensao vetorial p/ busca inteligente) — NAO usa o MariaDB central.
# Redis proprio (valkey). Senhas via Docker secrets (NUNCA env vars).
# Setup (1x): sops compose/sops-secrets.yaml -> IMMICH_* ; bash scripts/decrypt-secrets.sh

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich-server
    networks:
      - backend
    volumes:
      - ../data/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    # SSO discovery via Traefik sem depender do DNS .home na LAN (host-gateway = IP do host)
    extra_hosts:
      - "authentik.home:host-gateway"
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=database
      - DB_PORT=5432
      - DB_USERNAME=${IMMICH_DB_USERNAME:?IMMICH_DB_USERNAME required}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:?IMMICH_DB_NAME required}
      - DB_PASSWORD_FILE=/run/secrets/IMMICH_DB_PASSWORD
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/IMMICH_REDIS_PASSWORD
      - REDIS_DBINDEX=0
      # SSO via Authentik (OIDC). Provider criado por scripts/authentik-oidc-setup.sh
      - IMMICH_OIDC_ISSUER_URL=https://authentik.home/application/o/immich/
      - IMMICH_OIDC_CLIENT_ID=${IMMICH_OIDC_CLIENT_ID:?IMMICH_OIDC_CLIENT_ID required}
      # SSO via Authentik (OIDC). NOTA: Immich v3.1 nao suporta _FILE p/ OIDC secret —
      # este e o unico secret que vai como env var. Mitigado por docker.sock :ro e rede isolada.
      - IMMICH_OIDC_CLIENT_SECRET=${IMMICH_OIDC_CLIENT_SECRET:?IMMICH_OIDC_CLIENT_SECRET required}
      - IMMICH_OIDC_AUTO_REGISTER=false
    secrets:
      - IMMICH_DB_PASSWORD
      - IMMICH_REDIS_PASSWORD
    depends_on:
      database:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:2283/api/server/ping')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    container_name: immich-machine-learning
    networks:
      - backend
    volumes:
      - model-cache:/cache
    environment:
      - TZ=${TZ}
      - MACHINE_LEARNING_WORKERS=1  # host com 4 cores compartilhados com 24+ servicos
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:3003/ping', timeout=5)" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich-redis:
    image: valkey/valkey:9
    container_name: immich-redis
    networks:
      - backend
    volumes:
      - ../data/immich/redis:/data
    # setpriv replica o user-drop do entrypoint oficial (valkey) + requirepass via Docker secret
    command:
      - sh
      - -c
      - >-
        setpriv --reuid=valkey --regid=valkey --clear-groups --
        valkey-server --appendonly yes --requirepass "$(cat /run/secrets/IMMICH_REDIS_PASSWORD)"
    secrets:
      - IMMICH_REDIS_PASSWORD
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/IMMICH_REDIS_PASSWORD)\" ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    networks:
      - backend
    volumes:
      - ../data/immich/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/IMMICH_DB_PASSWORD
      - POSTGRES_USER=${IMMICH_DB_USERNAME:?IMMICH_DB_USERNAME required}
      - POSTGRES_DB=${IMMICH_DB_NAME:?IMMICH_DB_NAME required}
      - POSTGRES_INITDB_ARGS=--data-checksums
    secrets:
      - IMMICH_DB_PASSWORD
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  model-cache:
