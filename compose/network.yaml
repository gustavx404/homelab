---
# Shared networks and secrets — loaded first in all compose commands

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-homelab

# Secrets sao sourced do .env (gerado pelo sops). Containers recebem o valor via
# /run/secrets/<NOME> — nunca via env var. Apps usam *_FILE env var p/ ler o arquivo.
secrets:
  MARIADB_ROOT_PASSWORD:
    environment: MARIADB_ROOT_PASSWORD
  MARIADB_DATABASE:
    environment: MARIADB_DATABASE
  MARIADB_USER:
    environment: MARIADB_USER
  MARIADB_PASSWORD:
    environment: MARIADB_PASSWORD
  IMMICH_DB_PASSWORD:
    environment: IMMICH_DB_PASSWORD
  IMMICH_REDIS_PASSWORD:
    environment: IMMICH_REDIS_PASSWORD
  VAULTWARDEN_ADMIN_TOKEN:
    environment: VAULTWARDEN_ADMIN_TOKEN
  VAULTWARDEN_DATABASE_URL:
    environment: VAULTWARDEN_DATABASE_URL
  VAULTWARDEN_OIDC_CLIENT_SECRET:
    environment: VAULTWARDEN_OIDC_CLIENT_SECRET
  9ROUTER_INITIAL_PASSWORD:
    environment: 9ROUTER_INITIAL_PASSWORD
