---
# Security stack: IDS/IPS + intrusion prevention

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ../suricata/rules:/etc/suricata/rules
      - ../data/suricata:/var/log/suricata
    command:
      - -c
      - /etc/suricata/suricata.yaml
      - --af-packet
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f suricata > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    networks:
      - backend
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/suricata
      - GID=1000
      - UID=1000
    volumes:
      - ../data/suricata:/var/log/suricata:ro
      - crowdsec_data:/var/lib/crowdsec
      - ../crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ../crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ../crowdsec/scenarios/homelab-scan.yaml:/etc/crowdsec/scenarios/homelab-scan.yaml:ro
      - ../crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/whitelists.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cscli metrics > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  crowdsec-web-ui:
    build:
      context: ../crowdsec/web-ui
      dockerfile: Dockerfile
    image: homelab-crowdsec-web-ui:latest
    container_name: crowdsec-web-ui
    networks:
      - backend
    environment:
      - CONFIG_INSTANCE_LAPI_URL=http://crowdsec:8080
      - CONFIG_INSTANCE_LAPI_AUTH_USERNAME=crowdsec-web-ui
      - CONFIG_INSTANCE_LAPI_AUTH_PASSWORD=${CROWDSEC_WEBUI_LAPI_PASSWORD}
      - CONFIG_AUTH_ENABLED=false
      - CONFIG_UI_READ_ONLY=true
      - CONFIG_CROWDSEC_ALERT_FILTERS_INCLUDE_ORIGINS=[crowdsec]
    volumes:
      - crowdsec_webui_data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  crowdsec_data:
  crowdsec_webui_data:
