---
# Security stack: IDS/IPS + intrusion prevention

services:
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ../suricata/rules:/etc/suricata/rules
      - ../data/suricata:/var/log/suricata
    command:
      - -c
      - /etc/suricata/suricata.yaml
      - --af-packet
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f suricata > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    networks:
      - backend
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/suricata
      - GID=1000
      - UID=1000
      - NTFY_TOPIC_ALERTS=${NTFY_TOPIC_ALERTS:-alerts}
      - NTFY_TOKEN_CROWDSEC=${NTFY_TOKEN_CROWDSEC:-}
      - CROWDSEC_DB_PASSWORD=${CROWDSEC_DB_PASSWORD:-crowdsec_db_pass_2026}
    volumes:
      - ../data/suricata:/var/log/suricata:ro
      - crowdsec_data:/var/lib/crowdsec
      - ../crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ../crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ../crowdsec/scenarios/homelab-scan.yaml:/etc/crowdsec/scenarios/homelab-scan.yaml:ro
      - ../crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/whitelists.yaml:ro
      - ../crowdsec/notifications:/etc/crowdsec/notifications:ro
      - ../crowdsec/database.yaml:/etc/crowdsec/config.yaml.local:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cscli metrics > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  suricata-stats:
    image: python:3.13-alpine
    container_name: suricata-stats
    networks:
      - backend
    volumes:
      - ../data/suricata:/data:ro
      - ../scripts/suricata-stats.py:/app/suricata-stats.py:ro
    command: ["python3", "/app/suricata-stats.py"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8899/stats')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  crowdsec_data:
  crowdsec_webui_data:
