---
# Master compose — loads all stacks
# Individual stacks: compose/home.yaml compose/security.yaml compose/monitoring.yaml compose/services.yaml
# Use: docker compose $(ls compose/*.yaml | sort | xargs -I{} echo -n "-f {} ") up -d

include:
  - network.yaml
  - home.yaml
  - security.yaml
  - monitoring.yaml
  - media.yaml
  - services.yaml
  - vaultwarden.yaml
