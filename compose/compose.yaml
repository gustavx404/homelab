---
# Master compose — loads all stacks
# Individual stacks: compose/home.yaml compose/security.yaml compose/monitoring.yaml compose/services.yaml
# Use: docker compose -f compose/compose.yaml up -d  (include carrega todos os stacks)

include:
  - network.yaml
  - database.yaml
  - home.yaml
  - security.yaml
  - monitoring.yaml
  - media.yaml
  - services.yaml
  - authentik.yaml
  - immich.yaml
  - vaultwarden.yaml
  - tailscale.yaml
