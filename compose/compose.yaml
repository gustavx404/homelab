---
services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    networks:
      - backend
    volumes:
      - ../data/mariadb:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE_FILE=/run/secrets/MARIADB_DATABASE
      - MARIADB_USER_FILE=/run/secrets/MARIADB_USER
      - MARIADB_PASSWORD_FILE=/run/secrets/MARIADB_PASSWORD
    secrets:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    networks:
      - backend
    ports:
      - "8123:8123"
    volumes:
      - ../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - HOMEASSISTANT_LATITUDE=${HOMEASSISTANT_LATITUDE}
      - HOMEASSISTANT_LONGITUDE=${HOMEASSISTANT_LONGITUDE}
      - HOMEASSISTANT_ELEVATION=${HOMEASSISTANT_ELEVATION}
      - RECORDER_DB_URL=mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb/${MARIADB_DATABASE}?charset=utf8mb4
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    network_mode: host
    volumes:
      - ../homeassistant/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - backend
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data/grafana:/var/lib/grafana
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ../suricata/rules:/etc/suricata/rules:ro
      - ../data/suricata:/var/log/suricata
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
    restart: unless-stopped

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    networks:
      - backend
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - ../data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FORGEJO__database__DB_TYPE=sqlite3
    restart: unless-stopped

networks:
  backend:
    driver: bridge

secrets:
  MARIADB_ROOT_PASSWORD:
    environment: MARIADB_ROOT_PASSWORD
  MARIADB_DATABASE:
    environment: MARIADB_DATABASE
  MARIADB_USER:
    environment: MARIADB_USER
  MARIADB_PASSWORD:
    environment: MARIADB_PASSWORD
