---
services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    networks:
      - backend
    volumes:
      - ../data/mariadb:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE_FILE=/run/secrets/MARIADB_DATABASE
      - MARIADB_USER_FILE=/run/secrets/MARIADB_USER
      - MARIADB_PASSWORD_FILE=/run/secrets/MARIADB_PASSWORD
    secrets:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=50
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    entrypoint: ["/ha-entrypoint.sh"]
    networks:
      - backend
    ports:
      - "8123:8123"
    volumes:
      - ../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - ../homeassistant/ha-entrypoint.sh:/ha-entrypoint.sh:ro
    environment:
      - TZ=${TZ}
      - HOMEASSISTANT_LATITUDE=${HOMEASSISTANT_LATITUDE}
      - HOMEASSISTANT_LONGITUDE=${HOMEASSISTANT_LONGITUDE}
      - HOMEASSISTANT_ELEVATION=${HOMEASSISTANT_ELEVATION}
    secrets:
      - RECORDER_DB_URL
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  esphome:
    image: ghcr.io/esphome/esphome:2024.11.0
    container_name: esphome
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../homeassistant/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6052/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - backend
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data/grafana:/var/lib/grafana
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ../suricata/rules:/etc/suricata/rules:ro
      - ../data/suricata:/var/log/suricata
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep suricata > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:latest
    container_name: caddy
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
    environment:
      - CADDY_ADMIN=off
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    networks:
      - backend
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - ../data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FORGEJO__database__DB_TYPE=sqlite3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  mumble:
    image: lscr.io/linuxserver/murmur:latest
    container_name: mumble
    networks:
      - backend
    ports:
      - "64738:64738"
      - "64738:64738/udp"
    volumes:
      - ../data/mumble:/config
    environment:
      - TZ=${TZ}
      - MUMBLE_SUPERUSER_PASSWORD=${MUMBLE_SUPERUSER_PASSWORD:-changeme}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep murmurd > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  kali:
    image: lscr.io/linuxserver/webtop:kali-xfce
    container_name: kali
    networks:
      - backend
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ../data/kali:/config
    environment:
      - TZ=${TZ}
      - CUSTOM_USER=kali
      - PASSWORD=${KALI_PASSWORD:-kalilinux}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    shm_size: 1gb

networks:
  backend:
    driver: bridge

secrets:
  MARIADB_ROOT_PASSWORD:
    environment: MARIADB_ROOT_PASSWORD
  MARIADB_DATABASE:
    environment: MARIADB_DATABASE
  MARIADB_USER:
    environment: MARIADB_USER
  MARIADB_PASSWORD:
    environment: MARIADB_PASSWORD
  RECORDER_DB_URL:
    environment: RECORDER_DB_URL
