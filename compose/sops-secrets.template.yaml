# =============================================================================
# TEMPLATE de secrets — base para novos labs (fork do repositorio).
# Fluxo: bash scripts/init-sops.sh  (gera chave age + encripta este arquivo)
#        sops compose/sops-secrets.yaml   (editar valores reais)
#        bash scripts/decrypt-secrets.sh  (gera compose/.env)
# NUNCA commite valores reais em texto plano. Substitua todos os EXEMPLO_*.
# =============================================================================

# --- Geral ---
TZ: America/Sao_Paulo

# =============================================================================
# MariaDB — banco central (homeassistant, forgejo, grafana, crowdsec, mumble)
# Bancos/usuarios: compose/database-init/01-create-app-databases.sh (1o boot)
# =============================================================================
MARIADB_ROOT_PASSWORD: EXEMPLO_MARIADB_ROOT
MARIADB_DATABASE: homeassistant
MARIADB_USER: ha_user
MARIADB_PASSWORD: EXEMPLO_MARIADB_HA
FORGEJO_DB_PASSWORD: EXEMPLO_FORGEJO_DB
CROWDSEC_DB_PASSWORD: EXEMPLO_CROWDSEC_DB
GRAFANA_DB_PASSWORD: EXEMPLO_GRAFANA_DB
MUMBLE_DB_PASSWORD: EXEMPLO_MUMBLE_DB

# =============================================================================
# Home Assistant
# =============================================================================
HOMEASSISTANT_LATITUDE: "-15.78"
HOMEASSISTANT_LONGITUDE: "-47.93"
HOMEASSISTANT_ELEVATION: "1172"
HA_WEBHOOK_ID: crowdsec_alerts

# =============================================================================
# ESPHome
# =============================================================================
ESPHOME_USERNAME: admin
ESPHOME_PASSWORD: EXEMPLO_ESPHOME

# =============================================================================
# Grafana + SSO (OIDC via Authentik)
# =============================================================================
GRAFANA_ADMIN_USER: admin
GRAFANA_ADMIN_PASSWORD: EXEMPLO_GRAFANA
# OIDC: criar provider no Authentik (Admin > Applications > Providers > OAuth2)
#   Client type: Confidential | Grant: authorization_code
#   Redirect URI: https://grafana.home/login/generic_oauth
#   Scopes: openid profile email
# Depois preencher os valores abaixo com Client ID e Secret do provider
GRAFANA_OIDC_CLIENT_ID: EXEMPLO_GRAFANA_OIDC_ID
GRAFANA_OIDC_CLIENT_SECRET: EXEMPLO_GRAFANA_OIDC_SECRET

# =============================================================================
# Mumble (VoIP) — SuperUser
# =============================================================================
MUMBLE_CONFIG_supw: EXEMPLO_MUMBLE

# =============================================================================
# Frigate (NVR)
# =============================================================================
FRIGATE_RTSP_PASSWORD: ""

# =============================================================================
# Forgejo + SSO (OIDC via Authentik)
# =============================================================================
# OIDC: criar provider no Authentik (Admin > Applications > Providers > OAuth2)
#   Redirect URI: https://git.home/user/oauth2/authentik/callback
#   Scopes: openid profile email
FORGEJO_OIDC_CLIENT_ID: EXEMPLO_FORGEJO_OIDC_ID
FORGEJO_OIDC_CLIENT_SECRET: EXEMPLO_FORGEJO_OIDC_SECRET

# =============================================================================
# CrowdSec
# =============================================================================

# =============================================================================
# Authentik (IdP/SSO)
# =============================================================================
AUTHENTIK_SECRET_KEY: EXEMPLO_AUTHENTIK_SECRET_KEY
AUTHENTIK_POSTGRES_PASSWORD: EXEMPLO_AUTHENTIK_POSTGRES
AUTHENTIK_BOOTSTRAP_PASSWORD: EXEMPLO_AUTHENTIK_ADMIN
AUTHENTIK_BOOTSTRAP_EMAIL: admin@home

# =============================================================================
# Tailscale — acesso remoto + Funnel
# =============================================================================
TAILSCALE_AUTHKEY: EXEMPLO_TAILSCALE_AUTHKEY
