# =============================================================================
# TEMPLATE de secrets — base para novos labs (fork do repositorio).
# Fluxo: bash scripts/init-sops.sh  (gera chave age + encripta este arquivo)
#        sops compose/sops-secrets.yaml   (editar valores reais)
#        bash scripts/decrypt-secrets.sh  (gera compose/.env)
# NUNCA commite valores reais em texto plano. Substitua todos os EXEMPLO_*.
# =============================================================================
# --- Geral ---
TZ: America/Sao_Paulo
# --- Home Assistant ---
HOMEASSISTANT_LATITUDE: "-15.78"
HOMEASSISTANT_LONGITUDE: "-47.93"
HOMEASSISTANT_ELEVATION: "1172"
# --- MariaDB (banco central: homeassistant, forgejo, crowdsec) ---
MARIADB_ROOT_PASSWORD: EXEMPLO_MARIADB_ROOT
MARIADB_DATABASE: homeassistant
MARIADB_USER: ha_user
MARIADB_PASSWORD: EXEMPLO_MARIADB_HA
# Senhas dos bancos das apps no MariaDB central (bancos/usuarios criados em compose/database-init/ no primeiro boot)
FORGEJO_DB_PASSWORD: EXEMPLO_FORGEJO_DB
CROWDSEC_DB_PASSWORD: EXEMPLO_CROWDSEC_DB
GRAFANA_DB_PASSWORD: EXEMPLO_GRAFANA_DB
# --- ESPHome ---
ESPHOME_USERNAME: admin
ESPHOME_PASSWORD: EXEMPLO_ESPHOME
# --- Grafana ---
GRAFANA_ADMIN_USER: admin
GRAFANA_ADMIN_PASSWORD: EXEMPLO_GRAFANA
# --- Mumble (VoIP) ---
MUMBLE_CONFIG_supw: EXEMPLO_MUMBLE
# --- CrowdSec (widget Homepage) ---
CROWDSEC_HOMEPAGE_USERNAME: homepage
CROWDSEC_HOMEPAGE_PASSWORD: EXEMPLO_CROWDSEC_HOMEPAGE
# --- Frigate (NVR) ---
FRIGATE_RTSP_PASSWORD: ""
# --- Dashboard Homepage ---
HOMEPAGE_HA_KEY: EXEMPLO_TOKEN_LONGA_DURACAO_HA
HOMEPAGE_AUTH_USER: admin
HOMEPAGE_AUTH_PASSWORD: EXEMPLO_HOMEPAGE

# --- Forgejo (git) — token do widget do Homepage (criar em git.home: Settings > Applications, permissoes read:notification, read:repository, read:issue) ---
FORGEJO_TOKEN: EXEMPLO_FORGEJO_TOKEN
# --- ntfy (notificacoes push) ---
NTFY_ADMIN_PASSWORD: EXEMPLO_NTFY_ADMIN
NTFY_BASE_URL: https://ntfy.home
NTFY_TOPIC_ALERTS: alerts
NTFY_TOPIC_HOME: home
NTFY_TOKEN_CROWDSEC: EXEMPLO_NTFY_TOKEN
