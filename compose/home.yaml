---
# Home stack: home automation (banco central em database.yaml)

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    entrypoint: ["/ha-entrypoint.sh"]
    networks:
      - backend
    ports:
      - "172.19.0.1:8123:8123"
    volumes:
      - ../data/homeassistant:/config
      - ../homeassistant/custom_components:/config/custom_components:ro
      - /etc/localtime:/etc/localtime:ro
      - ../homeassistant/ha-entrypoint.sh:/ha-entrypoint.sh:ro
    environment:
      - TZ=${TZ}
      - HOMEASSISTANT_LATITUDE=${HOMEASSISTANT_LATITUDE}
      - HOMEASSISTANT_LONGITUDE=${HOMEASSISTANT_LONGITUDE}
      - HOMEASSISTANT_ELEVATION=${HOMEASSISTANT_ELEVATION}
    secrets:
      - MARIADB_USER
      - MARIADB_PASSWORD
      - MARIADB_DATABASE
    depends_on:
      mariadb:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tailscale Funnel dedicado p/ Home Assistant (node proprio = DNS publico)
  ts-homeassistant:
    image: tailscale/tailscale:latest
    container_name: ts-homeassistant
    hostname: ha1
    networks:
      - backend
    extra_hosts:
      - "host:172.19.0.1"
    volumes:
      # DO NOT delete this directory unless you want a brand-new Tailscale node
      # and a different DNSName like ha1-2, ha1-3, etc.
      - ../data/ts-homeassistant:/var/lib/tailscale
      - ../compose/ha-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:?TAILSCALE_AUTHKEY required}
      - TS_HOSTNAME=ha1
      - TS_CERT_DOMAIN=ha1.buru-eagle.ts.net
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../homeassistant/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - ESPHOME_USERNAME=${ESPHOME_USERNAME:-admin}
      - ESPHOME_PASSWORD=${ESPHOME_PASSWORD:?ESPHOME_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6052/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    shm_size: 1gb
