---
# Home stack: home automation (banco central em database.yaml)

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    entrypoint: ["/ha-entrypoint.sh"]
    networks:
      - backend
    volumes:
      - ../data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - ../homeassistant/ha-entrypoint.sh:/ha-entrypoint.sh:ro
    environment:
      - TZ=${TZ}
      - HOMEASSISTANT_LATITUDE=${HOMEASSISTANT_LATITUDE}
      - HOMEASSISTANT_LONGITUDE=${HOMEASSISTANT_LONGITUDE}
      - HOMEASSISTANT_ELEVATION=${HOMEASSISTANT_ELEVATION}
    secrets:
      - RECORDER_DB_URL
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../homeassistant/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - ESPHOME_USERNAME=${ESPHOME_USERNAME:-admin}
      - ESPHOME_PASSWORD=${ESPHOME_PASSWORD:-esphome}
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6052/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    shm_size: 1gb
