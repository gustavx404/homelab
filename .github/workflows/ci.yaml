---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: compose/ homeassistant/ suricata/ monitoring/ crowdsec/ traefik/ frigate/

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env from template (CI-only)
        run: cp compose/.env.example compose/.env
      - name: Validate all stacks
        run: docker compose -f compose/compose.yaml config --quiet

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan compose for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: compose/
          severity: CRITICAL,HIGH
          exit-code: 1

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6 # evita rajada de pulls simultaneos no GHCR (rate limit)
      matrix:
        image:
          - ghcr.io/home-assistant/home-assistant:stable
          - ghcr.io/esphome/esphome:stable
          - grafana/grafana:11.6.0
          - traefik:v3.3
          - prom/prometheus:v3.4.0
          - codeberg.org/forgejo/forgejo:16.0.2
          - mariadb:lts
          - crowdsecurity/crowdsec:latest
          - ghcr.io/blakeblackshear/frigate:stable
          - ghcr.io/goauthentik/server:2026.5.6
          - postgres:16-alpine
          - redis:7-alpine
    steps:
      - uses: actions/checkout@v5
      - name: Pull image (retry on GHCR rate limit)
        run: |
          for i in $(seq 1 5); do
            if docker pull --quiet "${{ matrix.image }}"; then exit 0; fi
            echo "pull falhou (tentativa $i de 5) - aguardando 15s"
            sleep 15
          done
          echo "nao foi possivel baixar ${{ matrix.image }}" >&2
          exit 1
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          exit-code: 0
          ignore-unfixed: true
