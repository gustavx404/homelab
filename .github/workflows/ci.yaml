---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: compose/ homeassistant/ suricata/ monitoring/

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f compose/compose.yaml config --quiet

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan compose for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: compose/
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Scan images for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: |
            ghcr.io/home-assistant/home-assistant:stable
            ghcr.io/esphome/esphome:2024.11.0
            prom/prometheus:latest
            grafana/grafana:latest
            caddy:latest
            codeberg.org/forgejo/forgejo:16.0.2
          severity: CRITICAL,HIGH
          exit-code: 0
