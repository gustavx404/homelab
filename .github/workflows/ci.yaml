---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: compose/ homeassistant/ suricata/ monitoring/

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f compose/compose.yaml config --quiet

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan compose for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: compose/
          severity: CRITICAL,HIGH
          exit-code: 1

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/home-assistant/home-assistant:stable
          - ghcr.io/esphome/esphome:stable
          - grafana/grafana:11.6.0
          - caddy:2-alpine
          - prom/prometheus:v3.4.0
          - codeberg.org/forgejo/forgejo:16.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: 0
