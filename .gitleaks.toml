title = "Gitleaks config for homelab"

[extend]
useDefault = true

[allowlist]
paths = [
  "(?i)*sops-secrets.yaml",
  "(?i)*sops-secrets.template.yaml",
  "(?i)*.example",
  "(?i)*.md",
  "(?i)*LICENSE*",
  "(?i)*.txt",
]
regexes = [
  'ENC\\[AES256_GCM,data:[A-Za-z0-9+/=]+',
  '_FILE=/run/secrets/',
  'config123',
  'changeme',
  'changethis',
  'your-.*-here',
  'example\\.com',
]

[[rules]]
description = "Detect potential private keys"
regex = '''-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----'''

[[rules]]
description = "Detect AWS keys"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
description = "Detect Generic API keys (20+ chars)"
regex = '''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)["']?\s*[:=]\s*["'][A-Za-z0-9_\-]{20,}["']'''

[[rules]]
description = "Detect passwords in config"
regex = '''(?i)password\s*[:=]\s*["'][^"']{8,}["']'''